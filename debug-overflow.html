<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>debug</title>
    <link rel="stylesheet" href="src/styles.css" />
  </head>
  <body>
    <div id="root"></div>
    <script src="vendor/react.production.min.js"></script>
    <script src="vendor/react-dom.production.min.js"></script>
    <script src="vendor/babel.min.js"></script>
    <script type="text/babel" data-presets="react" src="src/data/content.js"></script>
    <script type="text/babel" data-presets="react" src="src/components/Icons.jsx"></script>
    <script type="text/babel" data-presets="react" src="src/components/Illustrations.jsx"></script>
    <script type="text/babel" data-presets="react" src="src/components/Navbar.jsx"></script>
    <script type="text/babel" data-presets="react" src="src/components/Hero.jsx"></script>
    <script type="text/babel" data-presets="react" src="src/components/Features.jsx"></script>
    <script type="text/babel" data-presets="react" src="src/components/Pricing.jsx"></script>
    <script type="text/babel" data-presets="react" src="src/components/GlobalNetwork.jsx"></script>
    <script type="text/babel" data-presets="react" src="src/components/Testimonials.jsx"></script>
    <script type="text/babel" data-presets="react" src="src/components/Subscribe.jsx"></script>
    <script type="text/babel" data-presets="react" src="src/components/Footer.jsx"></script>
    <script type="text/babel" data-presets="react" src="src/App.jsx"></script>
    <script type="text/babel" data-presets="react" src="src/main.jsx"></script>
    <script>
      window.addEventListener("load", function () {
        setTimeout(function () {
          var W = document.documentElement.clientWidth;
          var out = [];
          document.querySelectorAll("body *").forEach(function (el) {
            var r = el.getBoundingClientRect();
            if (r.right > W + 1 || r.left < -1) {
              out.push(
                (el.tagName + "." + (el.className || "?")).substring(0, 46) +
                  "[L" + Math.round(r.left) + " R" + Math.round(r.right) + " W" + Math.round(r.width) + "]"
              );
            }
          });
          var d = document.createElement("pre");
          d.id = "dbg";
          d.style.cssText =
            "position:fixed;left:0;top:0;z-index:99999;background:#fff;color:#000;font:11px/1.35 monospace;padding:6px;margin:0;max-width:100%;white-space:pre-wrap";
          d.textContent = "VIEWPORT=" + W + " SCROLLW=" + document.documentElement.scrollWidth + "\n" + out.join("\n");
          document.body.appendChild(d);
        }, 2500);
      });
    </script>
  </body>
</html>
